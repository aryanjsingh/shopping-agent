<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instructions</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #eceff3;
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid #d4d9e2;
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      nav a {
        min-width: 32px;
        padding: 6px 10px;
        border: 1px solid #c9d0dc;
        border-radius: 6px;
        color: #1f2937;
        background: #ffffff;
        font-size: 13px;
        line-height: 1;
        text-align: center;
        text-decoration: none;
      }

      main {
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .page {
        margin: 0 0 28px;
      }

      .page h2 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 700;
        color: #4b5563;
      }

      .page img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #cfd5df;
        background: #ffffff;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
      }

      @media print {
        header {
          display: none;
        }

        main {
          width: 100%;
          padding: 0;
        }

        .page {
          margin: 0;
          break-after: page;
        }

        .page h2 {
          display: none;
        }

        .page img {
          border: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Instructions</h1>
      <nav aria-label="Pages">
        <a href="#page-1">1</a>
        <a href="#page-2">2</a>
        <a href="#page-3">3</a>
        <a href="#page-4">4</a>
        <a href="#page-5">5</a>
        <a href="#page-6">6</a>
        <a href="#page-7">7</a>
        <a href="#page-8">8</a>
      </nav>
    </header>
    <main>
      <section class="page" id="page-1">
        <h2>Page 1</h2>
        <img src="images/page-1.png" alt="Instruction page 1">
      </section>
      <section class="page" id="page-2">
        <h2>Page 2</h2>
        <img src="images/page-2.png" alt="Instruction page 2">
      </section>
      <section class="page" id="page-3">
        <h2>Page 3</h2>
        <img src="images/page-3.png" alt="Instruction page 3">
      </section>
      <section class="page" id="page-4">
        <h2>Page 4</h2>
        <img src="images/page-4.png" alt="Instruction page 4">
      </section>
      <section class="page" id="page-5">
        <h2>Page 5</h2>
        <img src="images/page-5.png" alt="Instruction page 5">
      </section>
      <section class="page" id="page-6">
        <h2>Page 6</h2>
        <img src="images/page-6.png" alt="Instruction page 6">
      </section>
      <section class="page" id="page-7">
        <h2>Page 7</h2>
        <img src="images/page-7.png" alt="Instruction page 7">
      </section>
      <section class="page" id="page-8">
        <h2>Page 8</h2>
        <img src="images/page-8.png" alt="Instruction page 8">
      </section>
    </main>
  </body>
</html>
